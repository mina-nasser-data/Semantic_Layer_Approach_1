name: semantic-layer

# Local stack: Trino (query engine) + Superset (BI + native semantic layer)
# + Postgres (Superset metadata DB) + semantic-sync (loads ./semantic YAML into Superset).
#
#   cp .env.example .env      # then edit the values
#   docker compose up -d --build
#   open http://localhost:8088

services:
  trino:
    image: trinodb/trino:${TRINO_VERSION:-476}
    ports:
      - "8080:8080"
    environment:
      # Read by trino/catalog/warehouse.properties as ${ENV:WAREHOUSE_DB_PASSWORD}.
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    volumes:
      # Catalogs = the warehouse connections Trino exposes (tpch is a built-in sample).
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      warehouse:
        condition: service_healthy

  # Sample star schema (stand-in for the bank's warehouse). Trino reads it as
  # catalog "warehouse"; connect DBeaver to localhost:5433 to build/inspect it.
  # SQL in ./warehouse/init runs once, when the volume is first created.
  warehouse:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      retries: 20

  superset-db:
    image: postgres:16
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      retries: 20

  superset:
    build:
      context: ./superset
      args:
        SUPERSET_VERSION: ${SUPERSET_VERSION:-7.0.0rc2}
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_URL: postgresql+psycopg2://superset:${SUPERSET_DB_PASSWORD}@superset-db:5432/superset
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      # bootstrap.sh registers this as the "Cube" database connection on every start.
      CUBE_URI: postgresql://cube:${CUBE_SQL_PASSWORD}@cube:15432/cube
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      # Superset extensions; cube-semantic-layer registers Cube as a semantic layer.
      - ./superset/extensions:/app/extensions:ro
    depends_on:
      superset-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 10s
      start_period: 60s
      retries: 30

  # External semantic layer, separate from ./semantic and CI: Cube reads its YAML
  # model in ./cube/model and queries Trino. Superset reaches it through the "Cube"
  # database connection (SQL API, Postgres protocol, port 15432) and sees every
  # Cube view as a table. Playground: http://localhost:4000
  cube:
    image: cubejs/cube:${CUBE_VERSION:-v1.8.6}
    ports:
      - "4000:4000"     # REST API + Playground
      - "15432:15432"   # SQL API (Postgres wire protocol)
    environment:
      CUBEJS_DB_TYPE: trino
      CUBEJS_DB_HOST: trino
      CUBEJS_DB_PORT: "8080"
      CUBEJS_DB_USER: cube
      CUBEJS_DB_PRESTO_CATALOG: warehouse   # tables in the model are fully qualified (warehouse.mart.x)
      CUBEJS_DEV_MODE: "true"      # Playground + hot reload of the model. Turn off in production.
      CUBEJS_API_SECRET: ${CUBE_API_SECRET}
      CUBEJS_PG_SQL_PORT: "15432"
      CUBEJS_SQL_USER: cube
      CUBEJS_SQL_PASSWORD: ${CUBE_SQL_PASSWORD}
    volumes:
      - ./cube/model:/cube/conf/model:ro
    depends_on:
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/readyz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      start_period: 30s
      retries: 30

  # Pushes the YAML in ./semantic into Superset through its REST API.
  # In --watch mode it re-imports every time a file in ./semantic changes,
  # so locally you just edit YAML and refresh Superset.
  semantic-sync:
    build: ./sync
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      # Values substituted into ${...} placeholders inside the YAML files:
      TRINO_URI: trino://superset@trino:8080/warehouse
      GIT_REPO_URL: ${GIT_REPO_URL:-}
    volumes:
      - ./semantic:/semantic:ro
    command: ["python", "sync.py", "/semantic", "--watch", "--smoke-test"]
    depends_on:
      superset:
        condition: service_healthy
      trino:
        condition: service_healthy

  # Superset 7 semantic layers. Keeps two layers in sync, in --watch mode:
  #   "Trino" - one semantic view per YAML file in ./semantic_views (uploaded via the API)
  #   "Cube"  - one semantic view per public view in ./cube/model/views
  # Add a file to either folder and the view appears in Superset's dataset list.
  semantic-views-sync:
    build: ./sync
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      CUBE_URL: http://cube:4000
      CUBE_API_SECRET: ${CUBE_API_SECRET}
    volumes:
      - ./semantic_views:/semantic_views:ro
    command: ["python", "semantic_views.py", "/semantic_views", "--watch", "--smoke-test"]
    depends_on:
      superset:
        condition: service_healthy
      cube:
        condition: service_healthy

volumes:
  superset-db-data:
  warehouse-data:
