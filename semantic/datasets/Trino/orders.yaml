# Physical dataset: one table, metrics defined on top of it.
table_name: orders
catalog: tpch
schema: tiny
sql: null
main_dttm_col: orderdate
description: One row per customer order. Grain = order.
cache_timeout: null
filter_select_enabled: true
uuid: 3aabca91-4e4b-4ae0-9fd0-b8818bfea500        # never change once deployed
database_uuid: c558dd1e-a16c-4438-8dda-1e86d43a733c
is_managed_externally: true                       # owned by Git, not the UI
external_url: ${GIT_REPO_URL:-}
version: 1.0.0

metrics:
  - metric_name: total_revenue
    verbose_name: Total Revenue
    expression: SUM(totalprice)
    description: Sum of order value, all statuses.
    d3format: ",.0f"

  - metric_name: order_count
    verbose_name: Orders
    expression: COUNT(*)
    description: Number of orders.
    d3format: ",d"

  - metric_name: avg_order_value
    verbose_name: Average Order Value
    expression: SUM(totalprice) / NULLIF(COUNT(*), 0)
    description: Total revenue divided by number of orders.
    d3format: ",.2f"

  - metric_name: open_order_share
    verbose_name: Open Order Share
    # CAST avoids integer division in Trino (1/3 = 0).
    expression: >-
      CAST(SUM(CASE WHEN orderstatus = 'O' THEN 1 ELSE 0 END) AS DOUBLE)
      / NULLIF(COUNT(*), 0)
    description: Share of orders still open (status O).
    d3format: ".1%"

columns:
  - {column_name: orderkey,      type: BIGINT,  groupby: false, filterable: true}
  - {column_name: custkey,       type: BIGINT,  groupby: false, filterable: true}
  - {column_name: orderstatus,   type: VARCHAR, groupby: true,  filterable: true, verbose_name: Order Status}
  - {column_name: totalprice,    type: DOUBLE,  groupby: false, filterable: true, verbose_name: Order Value}
  - {column_name: orderdate,     type: DATE,    groupby: true,  filterable: true, is_dttm: true, verbose_name: Order Date}
  - {column_name: orderpriority, type: VARCHAR, groupby: true,  filterable: true, verbose_name: Priority}
  - {column_name: clerk,         type: VARCHAR, groupby: true,  filterable: true}
