# Connection Superset uses to reach the warehouse (through Trino). No password in it.
database_name: Trino
sqlalchemy_uri: trino://superset@trino:8080/warehouse
cache_timeout: null
expose_in_sqllab: true
allow_run_async: false
allow_ctas: false
allow_cvas: false
allow_dml: false
allow_file_upload: false
extra:
  allows_virtual_table_explore: true
  allow_multi_catalog: true      # one connection can serve every Trino catalog
