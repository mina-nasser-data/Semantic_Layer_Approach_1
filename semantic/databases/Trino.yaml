# Connection Superset uses to reach the warehouse (through Trino).
# ${TRINO_URI} is filled in by sync.py from the environment, so the same file
# works for local, staging and prod. Never commit credentials.
database_name: Trino
sqlalchemy_uri: ${TRINO_URI}
cache_timeout: null
expose_in_sqllab: true
allow_run_async: false
allow_ctas: false
allow_cvas: false
allow_dml: false
allow_file_upload: false
extra:
  allows_virtual_table_explore: true
  allow_multi_catalog: true      # one connection can serve every Trino catalog
