# Date dimension (warehouse.mart.dim_date). One row per calendar day.
cubes:
  - name: dates
    sql_table: warehouse.mart.dim_date
    public: false

    dimensions:
      - name: date_key
        sql: date_key
        type: number
        primary_key: true

      - name: full_date
        title: Transaction Date
        sql: full_date
        type: time

      - name: year
        sql: year
        type: number

      - name: quarter
        sql: quarter
        type: number

      - name: month
        sql: month
        type: number

      - name: month_name
        sql: month_name
        type: string

      - name: day_name
        sql: day_name
        type: string

      - name: is_weekend
        sql: is_weekend
        type: boolean
        description: Friday or Saturday (Egypt weekend).
